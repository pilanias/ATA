<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATA Close and Burn</title>

  <link rel="stylesheet" href="https://unpkg.com/franken-ui-releases@0.0.11/dist/violet.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Outfit:wght@100..900&amp;display=swap"
    rel="stylesheet">
  
  <link rel="stylesheet" href="style.css"> 
  
  <style>
    /* Add a fallback for your custom 'text-white-text' if it's not in style.css */
    .text-white-text {
        color: #f0f0f0; /* Example white-ish color */
    }
  </style>

</head>

<body class="font-outfit bg-[#090314]">

  <main class="flex min-w-screen min-h-screen flex-col items-center gap-4 p-4 sm:p-8">
    <div class="w-full max-w-7xl mx-auto" id="pubkey">
      <div class="w-full relative" id="assets">
        
        <div class="rounded-lg bg-[#121026] text-card-foreground shadow-sm p-4 sm:p-6 mb-8 w-full">
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            
            <div class="grid gap-1 text-sm">
              <div id="after_connection">
                <button type="button" id="connect-wallet"
                  class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg transition-colors duration-200">
                  Connect Wallet
                </button>
              </div>
            </div>

            <div class="grid gap-1 text-sm">
              <span id="fee_payer_container" class="w-full">
                <div id="fee_payer_input_container">
                  <input type="password"
                    class="bg-gray-800 border border-gray-700 text-gray-300 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5"
                    id="fee-payer-key" placeholder="Fee payer private key (Optional)">
                </div>
                <div id="fee_payer_display_container" class="items-center" style="display: none; height: 42px;">
                  </div>
              </span>
            </div>

            <div class="grid gap-1 text-sm">
              <span id="des_Address_container" class="w-full">
                <div id="des_Address_input_container">
                  <input type="text"
                    class="bg-gray-800 border border-gray-700 text-gray-300 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5"
                    id="destination-address" placeholder="Destination Address (Optional)">
                </div>
                <div id="des_Address_display_container" class="items-center" style="display: none; height: 42px;">
                  </div>
              </span>
            </div>
          </div>

          <div id="status-message" class="text-gray-400 h-10 p-2 rounded-md transition-colors duration-200">
            Please connect your wallet.
          </div>

        </div>

        <form id="form" class="w-full">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-[#121026] rounded-lg p-4 sm:p-6 shadow-lg">
              
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-4">
                <div>
                  <h3 class="text-2xl text-white font-semibold">
                    <span class="text-purple-500 font-bold">Token </span>Account
                  </h3>
                </div>
                <div class="w-full sm:w-auto">
                  <button type="button"
                    class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 drop-shadow-lg text-white font-bold py-2 px-5 rounded-lg transition-colors duration-200"
                    id="burn-close-btn">
                    Burn & Close Selected
                  </button>
                </div>
              </div>

              <div class="flex items-center gap-3 p-2 mb-2 text-gray-300 border-b border-gray-700">
                <input type="checkbox" id="select-all-checkbox"
                  class="w-4 h-4 text-purple-600 bg-gray-700 border-gray-600 rounded focus:ring-purple-500 focus:ring-2">
                <label for="select-all-checkbox" class="font-medium">Select All</label>
              </div>

              <div id="tokens-to-burn-container" class="grid gap-2">
                <ul id="token-list" class="text-gray-300 space-y-2">
                  <p>Please connect your wallet to see your tokens.</p>
                </ul>
              </div>
            </div>

            <div class="bg-[#121026] rounded-lg p-4 sm:p-6 shadow-lg">
              <h3 class="text-2xl text-white font-semibold mb-4">
                <span class="text-gray-500 font-bold">Excluded </span>Accounts
              </h3>
              <ul id="excluded-list" class="text-gray-400 space-y-4" style="display: block;">
                </ul>
            </div>

          </div>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="/main.js"></script>
</body>

</html>
